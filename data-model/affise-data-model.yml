note: >-
  Entity-relationship graph derived from the Affise OpenAPI 3.1.1 document: the 14
  declared component schemas, their $ref links, and the id-reference fields
  (offer_id, advertiser, pid, affiliate_id, manager_id, category_id …) that appear
  across request parameters and response bodies. The spec's component layer is shallow —
  only 14 schemas for 167 operations, and most response bodies are declared inline rather
  than by $ref — so the entities marked `inline: true` below are real domain objects the
  API returns and accepts, but they have no reusable schema an agent can bind to. That is
  itself the most useful finding here: an integrator cannot generate a typed client for
  advertisers, partners, users, conversions, invoices or statistics rows from this
  contract, only for offers, payments and pixels.
identifier_style:
  numeric_ids: 'offers, affiliates (partners), users, goals, payments, pixels — plain integers'
  mongo_ids: 'advertisers — the spec and the MCP tooling both describe the advertiser id as a MongoId hex string'
  note: 'Ids are bare values with no type prefix, so an id alone does not identify its entity type.'
entities:
  - name: offer
    schema: '#/components/schemas/offer'
    inline: false
    properties: 81
    description: >-
      The central object of the platform — a campaign an advertiser runs and affiliates
      promote. Carries tracking URLs, targeting, payouts, caps, creatives, schedule and
      privacy.
    key_fields: [id, offer_id, advertiser, external_offer_id, bundle_id, title, url, trafficback_url]
    operations: ['GET /3.0/offers', 'GET /3.0/offer/{id}', 'POST /3.0/admin/offer', 'POST /3.0/admin/offer/{id}', 'POST /3.0/admin/offer/delete', 'GET /3.0/offers/count']
  - name: offer_affiliate
    schema: '#/components/schemas/offer_affiliate'
    inline: false
    properties: 42
    description: >-
      The affiliate-facing projection of an offer — the same campaign with payment detail
      hidden or reduced and performance metrics (cr, epc) added. A deliberate second view
      of one entity rather than a separate object.
    operations: ['GET /3.0/partner/offers', 'GET /3.0/partner/live-offers']
  - name: advertiser
    schema: null
    inline: true
    description: The brand whose campaigns are being promoted. Identified by a MongoId.
    operations: ['GET /3.0/admin/advertisers', 'GET /3.0/admin/advertiser/{id}', 'POST /3.0/admin/advertiser', 'POST /3.0/admin/advertiser/{id}']
  - name: affiliate
    aliases: [partner]
    schema: null
    inline: true
    description: >-
      The publisher driving traffic. Called "partner" in every URL path and "affiliate" in
      every summary and in the UI — the same entity under two names throughout the contract.
    operations: ['GET /3.0/admin/partners', 'GET /3.0/admin/partner/{id}', 'POST /3.0/admin/partner', 'POST /3.0/admin/partner/{id}', 'GET /3.1/partner/me', 'GET /3.0/admin/partner/{id}/referrals']
  - name: user
    schema: null
    inline: true
