note: >-
  Affise versions its API in the URI path and runs several path versions side by side in
  one document: of 167 operations, 117 sit under /3.0/, 47 under /3.1/, 2 under /4.0/ and
  1 under an unversioned /ui/ path. There is no published deprecation policy, no
  Sunset/Deprecation header support, no sunset dates, and NOT ONE operation carries
  `deprecated: true` — so a consumer of a /3.0/ path has no signal about whether its
  /3.1/ sibling supersedes it. The documentation itself is inconsistent about the
  current version: the page is served at /docs3.2/, info.version is '3.2', but
  info.description opens with "API 3.1 documentation" and the help center still titles
  the affiliate overview "API 3.1 documentation overview".
versioning:
  scheme: uri-path
  current: '3.2'
  docs: https://api.affise.com/docs3.2/
  path_versions_in_use:
    - version: '3.0'
      operations: 117
    - version: '3.1'
      operations: 47
    - version: '4.0'
      operations: 2
      note: 'Only the affiliate conversion import pair: POST /4.0/affiliate/conversion/import and /conversions/import.'
    - version: unversioned
      operations: 1
      note: 'GET /ui/offers/available-for/{affiliate_id} — an internal UI path exposed in the public reference.'
  previous_documentation:
    url: https://api.affise.com/docs3.1/
    http_status: 200
    note: >-
      The prior documentation build is still served alongside 3.2 with no notice of which
      is authoritative. /docs3.0/ and /docs/ both 404.
  note: >-
    Version numbers name the DOCUMENT, not per-path contracts. The 3.2 document
    describes the /3.0/, /3.1/ and /4.0/ paths simultaneously; there is no separate 3.0
    or 3.1 contract to migrate away from.
