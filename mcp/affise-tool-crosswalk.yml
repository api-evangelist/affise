    operations: 167
    operation_ids: 2
    gated: false
  mcp:
    server: mcp/affise-mcp.yml
    mode: local-stdio
    url: null
    gated: true
    gate: >-
      tools/list cannot be probed anonymously — the server is stdio-only and refuses to
      register its tool set until AFFISE_BASE_URL and AFFISE_API_KEY resolve. Tool names,
      descriptions and backing paths were therefore read from the published repository
      source rather than from a live tools/list response. Per-tool inputSchema is
      available in src/tools/*.ts but is not reproduced here.
  graphql:
    endpoint: null
    note: 'No GraphQL surface. https://api.affise.com/graphql returns the API 404 envelope.'
