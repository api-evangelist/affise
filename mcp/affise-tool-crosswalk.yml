source: mcp/affise-mcp.yml + openapi/affise-openapi.yml
note: >-
  Binds each of the 23 tools published by the first-party Affise MCP server to the REST
  operation(s) it actually calls. The bindings were read from the server's own source
  (each file under src/tools/ in github.com/affise/mcp-affise names its path literally),
  so confidence is high throughout — this is not a name-similarity guess.
  IMPORTANT: the Affise OpenAPI declares operationId on only 2 of its 167 operations, so
  every binding below is expressed as `METHOD path`, which is the only stable identifier
  the spec actually offers. Restoring operationIds is the single highest-value fix
  available to this contract; until then no tool can inherit a named operation.
surfaces:
