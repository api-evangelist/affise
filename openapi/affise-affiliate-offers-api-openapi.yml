  /3.0/partner/activation/offer:
    post:
      tags:
      - affiliate-offers
      summary: Activation offer
      description: '`POST /3.0/partner/activation/offer`


        Connect to an offer

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        required: true
        schema:
          type: string
        example: 23df424b0a53b0899f78685966243ee61
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                offer_id:
                  type: integer
                  description: Offer ID
                comment:
                  type: string
                  description: Comment
              required:
              - offer_id
              - comment
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 1
                message: Request is successfully
