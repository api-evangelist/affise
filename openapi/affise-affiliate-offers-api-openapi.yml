          type: object
          properties:
            allow:
              type: object
              additionalProperties:
                type: array
                items:
                  type: integer
            deny:
              type: object
              additionalProperties:
                type: array
                items:
                  type: integer
          description: 'list of allowed/denied regions for chosen country(ISO). Example: region[allow][US]=33'
        city:
          type: object
          properties:
            allow:
              type: object
              additionalProperties:
                type: array
                items:
                  type: integer
            deny:
              type: object
              additionalProperties:
                type: array
                items:
                  type: integer
          description: 'list of allowed/denied cities for chosen country(ISO). Example: city[allow][US]=57'
        os:
          type: object
          properties:
            allow:
              type: array
              items:
                $ref: '#/components/schemas/targeting_os_structure'
          description: list of allowed OSes and them versions.
        os_deny:
          type: integer
          enum:
          - 0
          - 1
          default: 0
          description: When set to 1 blocks values listed in os
        isp:
          type: object
          properties:
            allow:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            deny:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
