        connection:
          type: array
          items:
            type: string
            enum:
            - wi-fi
            - cellular
          description: list of allowed connection types.
        connection_deny:
          type: integer
          enum:
          - 0
          - 1
          default: 0
          description: When set to 1 blocks values listed in connection
