openapi: 3.2.0
info:
  title: Documentation Admin Affiliates API
  version: '3.2'
  x-logo:
    altText: Affise API documentation.
    url: affise_logo.svg
    backgroundColor: '#fafafa'
  description: 'API 3.1 documentation.


    Authorization


    ```shell

    curl --header "API-Key:23df424b0a53b0899f78685966243ee61" http://YOUR_API_DOMAIN/

    or

    curl http://YOUR_API_DOMAIN/some_path?API-Key=23df424b0a53b0899f78685966243ee61

    ```



    For data exchange using authentication public key passed as parameter in the header API-Key. As the key, a hash generated for your site. API key, you can see in your profile.


    Find out more about where you can get your API URL, API-key and personal API-key for Affiliate here - [Getting Started with API](https://help-center.affise.com/en/articles/6463675-start-with-api-networks)


    Postman collection


    A ready-to-use Postman collection covering all endpoints of this documentation is available in the [affise-postman-api-collection](https://github.com/affise/affise-postman-api-collection) repository. Import the collection together with the Demo environment, set your `baseUrl` and API keys in the environment variables, and you are ready to send requests.


    <aside class="warning">

    All API requests must include an API-Key header or API-Key GET parameter for client authentication.

    </aside>

    '
servers:
- url: https://api-demo.affise.com
  description: Demo Server
  variables:
    api-key:
      default: 685168e94e6a96fa7c31895e
      description: Demo Test API Key
tags:
- name: admin-affiliates
  x-displayName: Affiliates
  description: Admin operations on affiliates (partners)
paths:
  /3.0/admin/partners:
    get:
      tags:
      - admin-affiliates
      summary: Affiliate list
      description: '`GET /3.0/admin/partners`


        Get list of partners

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        required: true
        schema:
          type: string
      - name: id
        in: query
        description: Search by affiliate IDs
        schema:
          type: array
          items:
            type: integer
          example:
            id[0]: 2
      - name: with_balance
        in: query
        description: Show partners with balance
        schema:
          type: integer
          enum:
          - 1
      - name: limit
        in: query
        description: Limit of entities (max 500)
        schema:
          type: integer
          default: 50
          maximum: 500
      - name: page
        in: query
        description: Page of entities
        schema:
          type: integer
      - name: updated_at
        in: query
        description: Get partners that have been updated from this date (format YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: status
        in: query
        description: Filter by status
        schema:
          type: string
          enum:
          - active
          - banned
          - on moderation
          - not active
      - name: search
        in: query
        description: Search by affiliate email, login or name
        schema:
          type: string
      - name: manager
        in: query
        description: Filter by manager IDs
        schema:
          type: array
          items:
            type: string
          example:
            manager[0]: 5cd5fcced596c1280b3b6477
      - name: field
        in: query
        description: Filter by custom field values
        schema:
          type: array
          items:
            type: string
          example:
            field[0]: skype_name
      - name: order
        in: query
        description: Sort by field. Prefix the value with "-" for descending order
        schema:
          type: string
          enum:
          - id
          - -id
          - _id
          - -_id
          - created_at
          - -created_at
          - updated_at
          - -updated_at
      - name: orderType
        in: query
        description: Sorting order for the "order" field
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  partners:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        email:
                          type: string
                        login:
                          type: string
                        contactPerson:
                          type: string
                        ref_percent:
                          type: string
                        name:
                          type: string
                        notes:
                          type: string
                        manager:
                          type: object
                        status:
                          type: string
                        payment_systems:
                          type: array
                          items:
                            type: object
                        customFields:
                          type: array
                          items:
                            type: object
                        balance:
                          type: object
                        offersCount:
                          type: integer
                        api_key:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        lang:
                          type: string
                  pagination:
                    type: object
                    properties:
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      page:
                        type: integer
                      next_page:
                        type: integer
              example:
                status: 1
                partners:
                - id: 5
                  created_at: '2019-07-16 16:55:45'
                  updated_at: '2019-07-16 16:55:45'
                  email: login@gmail.com
                  login: treva.jones
                  ref_percent: '2'
                  name: null
                  notes: note
                  status: active
                  payment_systems:
                  - id: 10895
                    active: 0
                    system: Webmoney WMR
                    fields:
                      '1': '...'
                  customFields:
                  - name: Skype
                    value: '1'
                    label: '1'
                    id: 1
                  - name: '....'
                    value: '2'
                    label: '2'
                    id: 2
                  - name: '...'
                    value: '3'
                    label: '3'
                    id: 3
                  - name: '...'
                    value: '9'
                    label: '9'
                    id: 15
                  balance:
                    CNY:
                      balance: 0
                      hold: 0
                      available: 0
                    USD:
                      balance: 0
                      hold: 0
                      available: 0
                    EUR:
                      balance: 0
                      hold: 0
                      available: 0
                    BTC:
                      balance: 0
                      hold: 0
                      available: 0
                  offersCount: 0
                  api_key: eff64a90010faabc92f845a7969a618986478993
                  address_1: null
                  address_2: null
                  city: null
                  country: null
                  zip_code: null
                  phone: null
                  ref: '2'
                  lang: es
                  sub_accounts:
                    '1':
                      value: sub1
