  /3.0/admin/partners/mass-update:
    post:
      tags:
      - admin-affiliates
      summary: Mass update
      description: '`POST /3.0/admin/partners/mass-update`


        Update status and manager

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        required: true
        schema:
          type: string
        example: 23df424b0a53b0899f78685966243ee61
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                id:
                  type: array
                  items:
                    type: integer
                  description: Affiliate IDs
                manager_id:
                  type: string
                  description: Manager ID
                  example: 5ce558efd596c1e4008b4569
                status:
                  type: string
                  enum:
                  - not active
                  - active
                  - banned
                  - on moderation
                  description: Status
              required:
              - id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
              example:
                status: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: "curl --request POST \\\n  --url 'https://api-demo.affise.com/3.0/admin/partners/mass-update' \\\n  --header 'api-key: 23df424b0a53b0899f78685966243ee61' \\\n  --form 'id[0]=0' \\\n  --form 'id[1]=1' \\\n  --form 'manager_id=5ce558efd596c1e4008b4569' \\\n  --form 'status=not active'"
