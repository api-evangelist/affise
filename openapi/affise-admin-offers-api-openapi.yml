-form 'host_uniqueness_type=cookie' \\\n  --form 'product_feed_id=string'"
  /3.0/admin/offer/{id}:
    post:
      tags:
      - admin-offers
      summary: Edit offer
      description: '`POST /3.0/admin/offer/{id}`


        Change an offer settings

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        example: 23df424b0a53b0899f78685966243ee61
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Offer ID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Title
                advertiser:
                  type: string
                  description: Advertiser ID
                url:
                  type: string
                  description: Tracking URL
                parallel_tracking_url:
                  type: string
                  description: Parallel tracking URL
                cross_postback_url:
                  type: string
                  description: Cross-postback URL
                cross_postback_method:
                  type: string
                  enum:
                  - get
                  - post
                  description: Cross-postback method
                cross_postback_body:
                  type: string
                  description: Cross-postback body (required for cross_postback_method=post)
                macro_url:
                  type: string
                  description: Additional macro
                url_preview:
                  type: string
                  description: View URL
                trafficback_url:
                  type: string
                  description: Trafficback URL
