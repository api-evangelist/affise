components:
  schemas:
    targeting_browser_version_structure:
      type: object
      description: Browser version structure for targeting
      properties:
        name:
          type: string
          description: Browser's name.
        comparison:
          type: string
          enum:
          - LT
          - LTE
          - EQ
          - GT
          - GTE
          description: Comparison operation for browser's version.
        version:
          type: string
          description: Browser's version for comparison.
    offer_schedule_structure:
      type: object
      description: Offer schedule structure
      properties:
        enabled:
          type: integer
          enum:
          - 0
          - 1
          description: Enable/Disable offer schedule.
        date_start:
          type: string
          format: date
          description: Date of launch, YYYY-MM-DD. Offer activation does not depend on `enabled` field.
        date_to:
          type: string
          format: date
          description: Date of deactivation, YYYY-MM-DD
        timezone:
          type: string
          description: 'Timezone. Example: Europe/London'
        intervals:
          type: array
          description: 'Array of schedule intervals. Example: [weekday_number(0-6)][interval_number(0,1,2,...)][from]=hour(0-23)'
          items:
            type: array
            items:
              type: object
              properties:
                From:
                  type: integer
                  description: Start hour (0-23)
                  minimum: 0
                  maximum: 23
                To:
                  type: integer
                  description: End hour (0-23)
                  minimum: 0
                  maximum: 23
    targeting_os_structure:
      type: object
      description: OS structure for targeting
      properties:
        name:
          type: string
          description: OS name that could be found at OSes list method.
        comparison:
          type: string
          enum:
          - LT
          - LTE
          - EQ
          - GT
          - GTE
          description: Comparison operation for OS version.
        version:
          type: string
          description: OS version for comparison.
    offer_affiliate:
      type: object
      properties:
        id:
          type: integer
        offer_id:
          type: string
        bundle_id:
          type: string
        title:
          type: string
        preview_url:
          type: string
        description_lang:
          type: object
          additionalProperties:
            type: string
        cr:
          type: number
        epc:
          type: number
        logo:
          type: string
        logo_source:
          type: string
        stop_at:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              allowed:
                type: integer
        categories:
          type: array
          items:
            type: string
        full_categories:
          type: array
          items:
