                  type: string
                  description: Telegram
                viber:
                  type: string
                  description: Viber
                facebook:
                  type: string
                  description: Facebook
                wechat:
                  type: string
                  description: Wechat
                work_hours:
                  type: string
                  description: Working time
                avatar:
                  type: string
                  format: base64
