                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      forced:
                        type: string
                      pid:
                        type: string
                      integration_method:
                        type: string
              example:
                status: 1
                postback:
                  id: 960
                  url: http://YOUR_API_DOMAIN
                  status: by_creating
                  goal: null
                  created: '2017-06-20 02:17:58'
                  updated_at: '2017-06-20 02:17:58'
                  forced: '0'
