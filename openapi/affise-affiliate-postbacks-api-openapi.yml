openapi: 3.2.0
info:
  title: Documentation Affiliate Postbacks API
  version: '3.2'
  x-logo:
    altText: Affise API documentation.
    url: affise_logo.svg
    backgroundColor: '#fafafa'
  description: 'API 3.1 documentation.


    Authorization


    ```shell

    curl --header "API-Key:23df424b0a53b0899f78685966243ee61" http://YOUR_API_DOMAIN/

    or

    curl http://YOUR_API_DOMAIN/some_path?API-Key=23df424b0a53b0899f78685966243ee61

    ```



    For data exchange using authentication public key passed as parameter in the header API-Key. As the key, a hash generated for your site. API key, you can see in your profile.


    Find out more about where you can get your API URL, API-key and personal API-key for Affiliate here - [Getting Started with API](https://help-center.affise.com/en/articles/6463675-start-with-api-networks)


    Postman collection


    A ready-to-use Postman collection covering all endpoints of this documentation is available in the [affise-postman-api-collection](https://github.com/affise/affise-postman-api-collection) repository. Import the collection together with the Demo environment, set your `baseUrl` and API keys in the environment variables, and you are ready to send requests.


    <aside class="warning">

    All API requests must include an API-Key header or API-Key GET parameter for client authentication.

    </aside>

    '
servers:
- url: https://api-demo.affise.com
  description: Demo Server
  variables:
    api-key:
      default: 685168e94e6a96fa7c31895e
      description: Demo Test API Key
tags:
- name: affiliate-postbacks
  x-displayName: Postbacks
  description: Affiliate postback management
paths:
  /3.0/admin/postbacks:
    get:
      tags:
      - affiliate-postbacks
      summary: Affiliate postbacks list
      description: '`GET /3.0/admin/postbacks`


        Get a list of partner postbacks

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        required: true
        schema:
          type: string
      - name: partner_id
        in: query
        description: Partner ID
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Limit of entities (max 500)
        schema:
          type: integer
          default: 100
          maximum: 500
      - name: page
        in: query
        description: Page of entities
        schema:
          type: integer
      - name: offer_ids
        in: query
        description: Filter by offer IDs
        schema:
          type: array
          items:
            type: integer
          example:
            offer_ids[0]: 906
      - name: after_id
        in: query
        description: Show postbacks with ID greater than the specified one (cursor-style pagination)
        schema:
          type: integer
      - name: only_global
        in: query
        description: Show only global postbacks (not bound to a specific offer)
        schema:
          type: integer
          enum:
          - 0
          - 1
      - name: verbose
        in: query
        description: Return extended postback information
        schema:
          type: integer
          enum:
          - 0
          - 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  postbacks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        url:
                          type: string
                        offer_id:
                          type: string
                        status:
                          type: string
                        goal:
                          type: string
                        created:
                          type: string
                          format: date-time
                        forced:
                          type: string
                        integration_method:
                          type: string
                  pagination:
                    type: object
                    properties:
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      page:
                        type: integer
              example:
                status: 1
                postbacks:
                - id: 8
                  url: http://...
                  offer_id: null
                  status: pending
                  goal: ''
                  created: '2018-01-30 18:31:52'
                  forced: '0'
                  integration_method: all
                - id: 22
                  url: http://...
                  offer_id: '17'
                  status: null
                  goal: ''
                  created: '2018-05-14 12:39:51'
                  forced: '0'
                  integration_method: all
                pagination:
                  per_page: 100
                  total_count: 4
                  page: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: "curl --request GET \\\n  --url 'https://api-demo.affise.com/3.0/admin/postbacks?partner_id=<partner_id>&limit=100&offer_ids[0]=906&only_global=0&verbose=0' \\\n  --header 'api-key: <api-key>'"
  /3.0/partner/postback:
    post:
      tags:
      - affiliate-postbacks
      summary: Add partner postback
      description: '`POST /3.0/partner/postback`


        Add a partner''s postback

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        required: true
        schema:
          type: string
        example: 23df424b0a53b0899f78685966243ee61
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                offer_id:
                  type: integer
                  description: Offer ID (missed parameter means creation of global postback)
                url:
                  type: string
                  description: Example http://YOUR_API_DOMAIN
                status:
                  type: string
                  enum:
                  - by_creating
                  - confirmed
                  - pending
                  - declined
                  - hold
                  description: Postback status. Status "not_found" is deprecated and will be transformed to "declined".
                goal:
                  type: string
                  description: Postback goal (value)
                pid:
                  type: integer
                  description: Partner ID
                integration_method:
                  type: string
                  enum:
                  - all
                  - default
                  - skad
                  - probabilistic_attribution
                  default: all
                  description: Postback integration method
                forced:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: Forced postback flag
                meta:
                  type: object
                  description: Postback meta settings — conversion fields mapping for the Meta (Facebook) Conversions API integration. All values are strings. The fields meta_access_token, meta_pixel_id and event_name are required together when any of them is provided
                  additionalProperties: false
                  properties:
                    action_source:
                      type: string
                    city:
                      type: string
                    click_date:
                      type: string
                    comment:
                      type: string
                    currency:
                      type: string
                    custom_event_currency:
                      type: string
                    custom_event_value:
                      type: string
