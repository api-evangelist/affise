                      type: string
                    goal:
                      type: string
                custom_filter_field:
                  type: string
                  description: Custom filter — conversion field name to check before sending the postback
                custom_filter_text:
                  type: string
                  description: Custom filter — value the field set in custom_filter_field must match for the postback to be sent
              required:
              - url
              - pid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  postback:
                    type: object
                    properties:
                      id:
                        type: integer
                      url:
                        type: string
                      status:
                        type: string
                      goal:
                        type: string
                      created:
