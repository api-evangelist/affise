  /3.0/stats/getreferralpayments:
    get:
      tags:
      - advertiser-stats
      summary: By referral payments
      description: '`GET /3.0/stats/getreferralpayments`


        Get statistics by referral payments

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        example: 23df424b0a53b0899f78685966243ee61
        required: true
        schema:
          type: string
      - name: date_from
        in: query
        description: Date from
        required: true
        schema:
          type: string
          pattern: ^\d{2}-\d{2}-\d{4}$
          example: 31-05-2017
      - name: date_to
        in: query
        description: Date to
        required: true
        schema:
          type: string
          pattern: ^\d{2}-\d{2}-\d{4}$
          example: 31-05-2017
      - name: timezone
        in: query
        description: Timezone name. Example Europe/Berlin
        schema:
          type: string
      - name: pid
        in: query
        description: Partner ID
        schema:
          type: integer
      - name: pids
        in: query
        description: List of partner IDs
        schema:
          type: array
          items:
            type: integer
      - name: ref
        in: query
        description: Referral partner ID
        schema:
          type: integer
      - name: refs
        in: query
        description: List of referral partner IDs
        schema:
          type: array
          items:
            type: integer
      - name: is_paid
        in: query
        description: Status (0 => payouts, 1 => paid, 2 => pending)
        schema:
          type: integer
          enum:
          - 0
          - 1
          - 2
      - name: payment_statuses
        in: query
        description: List of is_paid values
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
      - name: status
        in: query
        description: Active (0 => no, 1 => yes)
        schema:
          type: integer
          enum:
          - 0
          - 1
      - name: page
        in: query
        description: Page of stat entities
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        description: Limit of stat entities
        schema:
          type: integer
          maximum: 500
          default: 100
      - name: currency
        in: query
        description: ID currency
        schema:
          type: integer
      - name: currencies
        in: query
        description: List of currency IDs
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  ref_payments:
                    type: array
                    items:
                      type: object
                      properties:
                        pid:
                          type: string
                        ref:
                          type: string
                        status:
                          type: string
                        is_paid:
                          type: string
                        currency:
                          type: string
                        count:
                          type: string
                        max_created_at:
                          type: string
                          format: date-time
                        date_registration_partner:
                          type: string
                          format: date-time
                        sum_revenue:
                          type: string
                  pagination:
                    type: object
                    properties:
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      page:
                        type: integer
              example:
                status: 1
                ref_payments:
                - pid: '2'
                  ref: '3'
                  status: '0'
                  is_paid: '0'
                  currency: USD
                  count: '4'
                  max_created_at: '2016-03-19 16:25:22'
                  date_registration_partner: '2016-10-30 10:22:12'
