  /3.0/stats/conversions:
    get:
      tags:
      - admin-stats
      summary: Conversions
      description: '`GET /3.0/stats/conversions`


        Get conversions

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        example: 23df424b0a53b0899f78685966243ee61
        required: true
        schema:
          type: string
      - name: date_from
        in: query
        description: Date from
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: Date to
        schema:
          type: string
          format: date
      - name: update_from_date
        in: query
        description: ONLY FOR ADMIN - Last update date point
        schema:
          type: string
          format: date
      - name: update_from_hour
        in: query
        description: ONLY FOR ADMIN - Last update hour point. Available only when update_from_date and update_to_date filters are used
        schema:
          type: integer
          minimum: 0
          maximum: 23
      - name: update_to_date
        in: query
        description: ONLY FOR ADMIN - End date of last update
        schema:
          type: string
          format: date
      - name: update_to_hour
        in: query
        description: ONLY FOR ADMIN - End hour of last update. Available only when update_from_date and update_to_date filters are used
        schema:
          type: integer
          minimum: 0
          maximum: 23
      - name: status[]
        in: query
        description: Status conversions. 1 = confirmed, 2 = pending, 3 = declined, 5 = hold
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            - 3
            - 5
      - name: offer[]
        in: query
        description: Offer ID collection
        schema:
          type: array
          items:
            type: integer
      - name: advertiser[]
        in: query
        description: Advertiser ID collection
        schema:
          type: array
          items:
            type: string
      - name: country[]
        in: query
        description: Countries codes. Example US
        schema:
          type: array
          items:
            type: string
      - name: browser
        in: query
        description: Browser
        schema:
          type: string
      - name: action_id
        in: query
        description: Cbid
        schema:
          type: string
      - name: clickid
        in: query
        description: Click ID
        schema:
          type: string
      - name: os
        in: query
        description: Os
        schema:
          type: string
      - name: goal
        in: query
        description: Goal
        schema:
          type: string
      - name: goal_id
        in: query
        description: Goal ID collection
        schema:
          type: array
          items:
            type: integer
