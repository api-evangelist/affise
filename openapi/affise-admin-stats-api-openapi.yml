openapi: 3.2.0
info:
  title: Documentation Admin Stats API
  version: '3.2'
  x-logo:
    altText: Affise API documentation.
    url: affise_logo.svg
    backgroundColor: '#fafafa'
  description: 'API 3.1 documentation.


    Authorization


    ```shell

    curl --header "API-Key:23df424b0a53b0899f78685966243ee61" http://YOUR_API_DOMAIN/

    or

    curl http://YOUR_API_DOMAIN/some_path?API-Key=23df424b0a53b0899f78685966243ee61

    ```



    For data exchange using authentication public key passed as parameter in the header API-Key. As the key, a hash generated for your site. API key, you can see in your profile.


    Find out more about where you can get your API URL, API-key and personal API-key for Affiliate here - [Getting Started with API](https://help-center.affise.com/en/articles/6463675-start-with-api-networks)


    Postman collection


    A ready-to-use Postman collection covering all endpoints of this documentation is available in the [affise-postman-api-collection](https://github.com/affise/affise-postman-api-collection) repository. Import the collection together with the Demo environment, set your `baseUrl` and API keys in the environment variables, and you are ready to send requests.


    <aside class="warning">

    All API requests must include an API-Key header or API-Key GET parameter for client authentication.

    </aside>

    '
servers:
- url: https://api-demo.affise.com
  description: Demo Server
  variables:
    api-key:
      default: 685168e94e6a96fa7c31895e
      description: Demo Test API Key
tags:
- name: admin-stats
  x-displayName: Statistics
  description: Statistics endpoints available to admin (includes admin-only and multi-role)
paths:
  /3.0/stats/custom:
    get:
      tags:
      - admin-stats
      summary: Custom statistics
      description: '`GET /3.0/stats/custom`


        Get custom statistics

        '
      parameters:
      - name: api-key
        in: header
        description: API key
        example: 23df424b0a53b0899f78685966243ee61
        required: true
        schema:
          type: string
      - name: slice[]
        in: query
        description: Custom stats slice
        required: true
        schema:
          type: array
          items:
            type: string
            enum:
            - hour
            - month
            - quarter
            - year
            - day
            - offer
            - country
            - city
            - os
            - os_version
            - device
            - device_model
            - browser
            - goal
            - sub1
            - sub2
            - sub3
            - sub4
            - sub5
            - advertiser
            - affiliate
            - manager
            - smart_id
            - trafficback_reason
      - name: filter[date_from]
        in: query
        description: Date from
        required: true
        schema:
          type: string
          format: date
      - name: filter[date_to]
        in: query
        description: Date to
        required: true
        schema:
          type: string
          format: date
      - name: filter[currency]
        in: query
        description: The list of a currencies code
        schema:
          type: array
          items:
            type: string
      - name: filter[advertiser]
        in: query
        description: Advertiser IDs
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[offer]
        in: query
        description: Offers IDs
        schema:
          type: array
          items:
            type: integer
      - name: filter[manager]
        in: query
        description: Managers IDs
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[advertiser_manager_id]
        in: query
        description: Advertiser managers IDs
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[partner]
        in: query
        description: ONLY FOR ADMIN - Partners IDs
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[country]
        in: query
        description: Countries codes. Example US
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[os]
        in: query
        description: Os
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[goal]
        in: query
        description: Goal
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[sub1]
        in: query
        description: Sub number 1
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[sub2]
        in: query
        description: Sub number 2
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[sub3]
        in: query
        description: Sub number 3
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[sub4]
        in: query
        description: Sub number 4
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[sub5]
        in: query
        description: Sub number 5
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[sub6]
        in: query
        description: Sub number 6
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[sub7]
        in: query
        description: Sub number 7
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[sub8]
        in: query
        description: Sub number 8
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[device]
        in: query
        description: Device
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[smart_id]
        in: query
        description: Allowed only when the smart slice selected - SmartLink categories IDs
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: filter[nonzero]
        in: query
        description: Non-zero conversions
        schema:
          type: integer
          enum:
          - 0
          - 1
      - name: filter[advertiser_tag]
        in: query
        description: Comma separated array of strings. Example tag1,tag2,tag3
        schema:
          type: string
      - name: filter[affiliate_tag]
        in: query
        description: Comma separated array of strings. Example tag1,tag2,tag3
        schema:
          type: string
      - name: filter[offer_tag]
        in: query
        description: Comma separated array of strings. Example tag1,tag2,tag3
        schema:
          type: string
      - name: not_offer_id
        in: query
        description: ONLY FOR ADMIN — Offer IDs to exclude from results
        schema:
          type: array
          items:
            type: integer
      - name: not_advertiser_id
        in: query
        description: ONLY FOR ADMIN — Advertiser IDs to exclude from results
        schema:
          type: array
          items:
            type: string
      - name: not_affiliate_id
        in: query
        description: ONLY FOR ADMIN — Partner (affiliate) IDs to exclude from results
        schema:
          type: array
          items:
            type: integer
      - name: not_advertiser_manager_id
        in: query
        description: ONLY FOR ADMIN — Advertiser manager IDs to exclude from results
        schema:
          type: array
          items:
            type: string
      - name: not_affiliate_manager_id
        in: query
        description: ONLY FOR ADMIN — Affiliate manager IDs to exclude from results
        schema:
          type: array
          items:
            type: string
      - name: not_smartlink_id
        in: query
        description: ONLY FOR ADMIN — SmartLink category IDs to exclude from results
        schema:
          type: array
          items:
            type: string
      - name: not_country
        in: query
        description: 'ONLY FOR ADMIN — Country codes to exclude from results. Example: US'
        schema:
          type: array
          items:
            type: string
      - name: not_advertiser_tag
        in: query
        description: 'ONLY FOR ADMIN — Comma-separated advertiser tags to exclude. Example: tag1,tag2'
        schema:
          type: string
      - name: not_affiliate_tag
        in: query
        description: 'ONLY FOR ADMIN — Comma-separated affiliate tags to exclude. Example: tag1,tag2'
        schema:
          type: string
      - name: not_offer_tag
        in: query
        description: 'ONLY FOR ADMIN — Comma-separated offer tags to exclude. Example: tag1,tag2'
        schema:
          type: string
      - name: filter[payment_status]
        in: query
        description: Conversion payment status
        schema:
          type: string
          enum:
          - opened
          - closed
          - pending
      - name: locale
        in: query
        description: Locale for output a cities data when you use the city slice
        schema:
          type: string
          enum:
          - ru
          - en
          - es
          default: en
      - name: conversionTypes[]
        in: query
        description: Only this conversion types will be output
        schema:
          type: array
          items:
            type: string
            enum:
            - total
            - confirmed
            - pending
            - declined
            - hold
      - name: page
        in: query
        description: Page of stat entities
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        description: Limit of stat entities
        schema:
          type: integer
          maximum: 500
          default: 100
      - name: orderType
        in: query
        description: Sorting order
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: order[]
        in: query
        description: Sort by field
        schema:
          type: array
          items:
            type: string
            enum:
            - hour
            - month
            - quarter
            - year
            - day
            - currency
            - offer
            - country
            - city
            - os
            - os_version
            - device
            - device_model
            - browser
            - goal
            - sub1
            - sub2
            - sub3
            - sub4
            - sub5
            - confirmed_earning
            - raw
            - uniq
            - total_count
            - total_revenue
            - total_null
            - pending_count
            - pending_revenue
            - declined_count
            - declined_revenue
            - hold_count
            - hold_revenue
            - confirmed_count
            - confirmed_revenue
            - advertiser
            - affiliate
            - manager
      - name: timezone
        in: query
        description: Timezone name. Example Europe/Berlin
        schema:
          type: string
      - name: fields[]
        in: query
        description: Custom stats fields
        schema:
          type: array
          items:
            type: string
            enum:
            - clicks
            - hosts
            - earnings
            - income
            - noincome
            - payouts
            - conversions
            - cr
            - affiliate_epc
            - ratio
            - epc
            - trafficback
            - ctr
            - views
            - ecpm
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  stats:
                    type: array
                    items:
                      type: object
                      properties:
                        slice:
                          type: object
                          additionalProperties: true
                        traffic:
                          type: object
                          properties:
                            raw:
                              type: string
                            uniq:
                              type: string
                        actions:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              revenue:
                                type: number
                              charge:
                                type: number
                              earning:
                                type: number
                              'null':
                                type: integer
                              count:
                                type: integer
                  pagination:
                    type: object
                    properties:
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      page:
                        type: integer
              example:
                status: 1
                stats:
                - slice:
                    year: 2017
                    month: 3
                    day: 1
                  traffic:
                    raw: '1607530'
                    uniq: '1468939'
                  actions:
                    total:
                      revenue: 1252
                      charge: 1352.52
                      earning: 100.52
                      'null': 825
                      count: 1092
                    confirmed:
                      revenue: 1252
                      charge: 1352.52
                      earning: 100.52
                      'null': 728
                      count: 995
                    pending:
                      revenue: 0
                      charge: 0
                      earning: 0
                      'null': 0
                      count: 0
                    declined:
                      revenue: 0
                      charge: 0
                      earning: 0
                      'null': 0
                      count: 0
                    hold:
                      revenue: 0
                      charge: 0
                      earning: 0
                      'null': 97
                      count: 97
                pagination:
                  per_page: 100
                  total_count: 1
                  page: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: "curl --request GET \\\n  --url 'https://api-demo.affise.com/3.0/stats/custom?slice[0]=hour&filter[date_from]=<filter[date_from]>&filter[date_to]=<filter[date_to]>&filter[currency][0]=string&filter[currency][1]=string2&filter[offer][0]=0&filter[offer][1]=1&filter[nonzero]=0&not_offer_id[0]=0&not_offer_id[1]=1&not_advertiser_id[0]=string&not_advertiser_id[1]=string2&not_affiliate_id[0]=0&not_affiliate_id[1]=1&not_advertiser_manager_id[0]=string&not_advertiser_manager_id[1]=string2&not_affiliate_manager_id[0]=string&not_affiliate_manager_id[1]=string2&not_smartlink_id[0]=string&not_smartlink_id[1]=string2&not_country[0]=string&not_country[1]=string2&filter[payment_status]=opened&locale=en&conversionTypes[0]=total&page=1&limit=100&orderType=asc&order[0]=hour&fields[0]=clicks' \\\n  --header 'api-key: 23df424b0a53b0899f78685966243ee61'"
