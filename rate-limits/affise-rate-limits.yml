    scope: per-api-key
    limit: unspecified
    period: unspecified
    unit: requests
    target: Affiliate API endpoints
    notes: >-
      Limits are enforced per API key and vary by plan tier. Higher-tier
      plans receive increased rate limit allocations.
  - name: Statistics API Rate Limit
    description: >-
