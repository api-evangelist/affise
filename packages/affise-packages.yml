source: >-
  Registry metadata endpoints (registry.npmjs.org, pub.dev, proxy.golang.org,
  search.maven.org, trunk.cocoapods.org, repo.packagist.org) plus the github.com/affise
  organization repo listing.
note: >-
  Affise's first-party client libraries split cleanly in two. The Affise MMP
  (Mobile Measurement Partner) attribution SDKs are actively released across six
  platforms — all six shipped within the last ten days of this probe. The Affise
  Performance REST API server-side SDKs (Go, PHP) are NOT maintained: the newest is
  from May 2024 and the PHP client's only Packagist release is v0.1.1 from June 2021,
  three major API revisions before the current 3.2 documentation. A consumer of the
  Performance API should treat the Postman collection and the OpenAPI as the
  supported integration path, not those SDKs.
