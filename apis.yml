aid: affise
name: Affise
description: >-
  Affise is a performance marketing platform with a REST API for managing
  affiliate offers, publishers, conversions, payouts, and accessing detailed
  campaign analytics. The API supports both admin and affiliate panel operations
  using API key authentication with GET and POST methods across statistics,
  conversions, offers, partners, and billing endpoints.
