apis:
  - aid: affise:affise-performance-api
    name: Affise Performance API
    description: >-
      REST API for the Affise Performance platform enabling admins and affiliates
      to manage offers, track conversions, retrieve statistics, handle publisher
      payouts, and automate billing operations programmatically.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://affise.com/api/
    baseURL: https://api.affise.com
    tags:
      - Affiliate Marketing
      - Offers
      - Conversions
      - Statistics
      - Payouts
    properties:
      - type: Documentation
        url: https://help-center.affise.com/en/articles/6492567-api-3-1-documentation-overview-admins
      - type: Documentation
        url: https://help-center.affise.com/en/articles/6790524-api-3-1-documentation-overview-affiliates
      - type: PostmanCollection
        url: https://github.com/affise/affise-postman-api-collection
    contact:
      - FN: Affise Support
        url: https://affise.com/contact-us/
  - aid: affise:affise-mmp-api
    name: Affise MMP API
    description: >-
      Mobile Measurement Partner API enabling mobile app attribution tracking,
      install measurement, event tracking, and audience analytics for iOS,
      Android, and cross-platform mobile applications.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://intercom.help/affise-mmp/en
    baseURL: https://api.affise.com
    tags:
