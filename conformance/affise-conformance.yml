    conforms: true
    evidence: 'openapi: 3.1.1 document served at https://api.affise.com/docs3.2/bundled.yaml; 154 paths, 167 operations, 14 component schemas.'
  - id: openapi-operation-ids
    conforms: false
    evidence: 'Only 2 of 167 operations declare an operationId (addPartnerPixel, deleteInvoiceConversions).'
  - id: openapi-security-schemes
    conforms: false
    evidence: 'components.securitySchemes is absent; auth is an ordinary api-key header parameter on 155 operations.'
  - id: rest
    conforms: partial
    evidence: >-
      Resource-oriented paths and JSON responses, but only GET/POST/DELETE are used —
      POST covers both create and update, and write bodies are form-encoded.
