    conforms: false
    evidence: 'No oauth2 securityScheme; /.well-known/oauth-authorization-server returns 404 on every host.'
  - id: oidc
    conforms: false
    evidence: '/.well-known/openid-configuration returns 404 on affise.com and api.affise.com.'
  - id: rfc9457-problem-details
    conforms: false
    evidence: 'Errors use a proprietary {"status": 2, "message": "..."} envelope; no application/problem+json anywhere in the spec.'
  - id: rfc9116-security-txt
    conforms: partial
    evidence: >-
      /.well-known/security.txt returns 200 with Contact and Expires, but Expires is
