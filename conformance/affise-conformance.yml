      conflicting file sits at the non-canonical /security.txt.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: 'No Sunset or Deprecation header support and no deprecation policy is published.'
  - id: rfc6585-rate-limit
    conforms: false
    evidence: 'No 429 response declared on any operation; no RateLimit-*/X-RateLimit-* headers documented or observed.'
  - id: asyncapi
    conforms: false
    evidence: 'A documented webhook/postback event surface exists but no AsyncAPI document is published. See asyncapi/affise-postbacks-webhooks.yml.'
  - id: webhook-signing
    conforms: false
    evidence: 'Outbound affiliate postbacks carry no HMAC signature or shared secret.'
  - id: idempotency-key
    conforms: false
    evidence: 'No Idempotency-Key header or request-token de-duplication on any write operation.'
  - id: json-api
    conforms: false
    evidence: 'Responses are a flat proprietary envelope, not JSON:API documents.'
  - id: mcp
    conforms: true
    evidence: >-
      First-party MCP server at github.com/affise/mcp-affise, @modelcontextprotocol/sdk
      ^1.29.0, stdio transport, 23 tools and 6 prompts, published to npm as
      @affise/mcp-server 2.1.0.
  - id: llms-txt
    conforms: true
    evidence: 'https://affise.com/llms.txt returns 200 with a valid llms.txt structure (H1, blockquote summary, ## sections).'
  - id: a2a-agent-card
    conforms: false
    evidence: '/.well-known/agent-card.json and /.well-known/agent.json return 404 on affise.com, api.affise.com and help-center.affise.com.'
