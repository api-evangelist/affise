note: >-
  Two different things are recorded here. The ORGANIZATIONAL compliance posture is real
  and published: Affise completed a SOC 2 Type II certification and carries the AICPA SOC
  II and GDPR badges in its own site footer, with a dedicated GDPR page describing IP
  obfuscation, device-ID blanking, retention windows and access controls. The TECHNICAL
  standards posture is thin: the contract is OpenAPI 3.1.1 and that is essentially the
  whole list — no OAuth, no OIDC, no RFC 9457, no RFC 9116-current security.txt, no
  standard rate-limit headers, no JSON:API, no idempotency convention.
standards:
